<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henty - Audiobook Creation Suite</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .landing-container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
        }

        .card-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }

        .project-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
        }

        .project-card .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .project-card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #333;
        }

        .project-card p {
            color: #666;
            line-height: 1.6;
            font-size: 1em;
        }

        .recent-projects {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            color: white;
        }

        .recent-projects h3 {
            font-size: 1.2em;
            margin-bottom: 15px;
            opacity: 0.95;
        }

        .recent-project-list {
            list-style: none;
        }

        .recent-project-item {
            padding: 10px 15px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recent-project-item:hover {
            background: rgba(255,255,255,0.2);
        }

        .recent-project-name {
            font-weight: 500;
        }

        .recent-project-date {
            font-size: 0.85em;
            opacity: 0.8;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .error-message {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .card-container {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .project-card {
                padding: 30px;
            }

            .project-card .icon {
                font-size: 60px;
            }

            .project-card h2 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="header">
            <h1>🎤 Henty</h1>
            <p>Professional Audiobook Creation Suite</p>
        </div>

        <div class="card-container">
            <div class="project-card" onclick="showNewProjectModal()">
                <div class="icon">✨</div>
                <h2>New Project</h2>
                <p>Start a fresh audiobook project from scratch</p>
            </div>

            <div class="project-card" onclick="showLoadProjectModal()">
                <div class="icon">📂</div>
                <h2>Load Project</h2>
                <p>Continue working on an existing project</p>
            </div>
        </div>

        <div class="recent-projects" id="recentProjects" style="display: none;">
            <h3>Recent Projects</h3>
            <ul class="recent-project-list" id="recentProjectList"></ul>
        </div>
    </div>

    <!-- New Project Modal -->
    <div class="modal" id="newProjectModal">
        <div class="modal-content">
            <h2>Create New Project</h2>
            <form id="newProjectForm" onsubmit="createNewProject(event)">
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" required placeholder="Enter project name">
                </div>
                <div class="form-group">
                    <label for="projectPath">Project Location (optional)</label>
                    <input type="text" id="projectPath" placeholder="Leave empty to use default location">
                    <small style="color: #666; font-size: 12px; margin-top: 4px; display: block;">
                        Default: Projects folder
                    </small>
                </div>
                <div class="form-group">
                    <label>Text Source</label>
                    <div style="margin-bottom: 15px;">
                        <label style="display: inline-flex; align-items: center; margin-right: 20px; font-weight: normal; cursor: pointer;">
                            <input type="radio" name="textSourceType" value="url" checked onchange="toggleTextSourceInput()" style="margin-right: 8px; width: auto;">
                            Gutenberg URL
                        </label>
                        <label style="display: inline-flex; align-items: center; font-weight: normal; cursor: pointer;">
                            <input type="radio" name="textSourceType" value="file" onchange="toggleTextSourceInput()" style="margin-right: 8px; width: auto;">
                            Upload Text File
                        </label>
                    </div>
                    <div id="urlSourceInput">
                        <input type="url" id="gutenbergUrl" placeholder="Enter Gutenberg URL" value="https://www.gutenberg.org/cache/epub/4932/pg4932.txt">
                    </div>
                    <div id="fileSourceInput" style="display: none;">
                        <input type="file" id="textFile" accept=".txt" style="padding: 8px;">
                    </div>
                </div>
                <div class="error-message" id="newProjectError"></div>
                <div class="btn-container">
                    <button type="button" class="btn btn-secondary" onclick="closeNewProjectModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Load Project Modal -->
    <div class="modal" id="loadProjectModal">
        <div class="modal-content">
            <h2>Load Existing Project</h2>
            <form id="loadProjectForm" onsubmit="loadExistingProject(event)">
                <div class="form-group">
                    <label for="existingProjectPath">Project Path</label>
                    <input type="text" id="existingProjectPath" required placeholder="/path/to/project">
                </div>
                <div class="error-message" id="loadProjectError"></div>
                <div class="btn-container">
                    <button type="button" class="btn btn-secondary" onclick="closeLoadProjectModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Load Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="client_config.js"></script>
    <script>
        // Load recent projects on page load
        window.addEventListener('DOMContentLoaded', loadRecentProjects);

        async function loadRecentProjects() {
            try {
                const response = await fetch(`${SERVER_URL}/api/project/recent`, {
                    headers: {
                        'X-API-Key': API_KEY
                    }
                });

                if (response.ok) {
                    const projects = await response.json();
                    if (projects.length > 0) {
                        displayRecentProjects(projects);
                    }
                }
            } catch (error) {
                console.log('Could not load recent projects:', error);
            }
        }

        function displayRecentProjects(projects) {
            const container = document.getElementById('recentProjects');
            const list = document.getElementById('recentProjectList');

            list.innerHTML = projects.slice(0, 5).map(project => `
                <li class="recent-project-item" onclick="loadProjectByPath('${project.path}')">
                    <span class="recent-project-name">${project.name}</span>
                    <span class="recent-project-date">${formatDate(project.last_modified)}</span>
                </li>
            `).join('');

            container.style.display = 'block';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            return date.toLocaleDateString();
        }

        function showNewProjectModal() {
            document.getElementById('newProjectModal').classList.add('active');
            document.getElementById('projectName').focus();
        }

        function closeNewProjectModal() {
            document.getElementById('newProjectModal').classList.remove('active');
            document.getElementById('newProjectError').textContent = '';
            document.getElementById('newProjectForm').reset();
            toggleTextSourceInput(); // Reset to default view
        }

        function toggleTextSourceInput() {
            const sourceType = document.querySelector('input[name="textSourceType"]:checked').value;
            const urlInput = document.getElementById('urlSourceInput');
            const fileInput = document.getElementById('fileSourceInput');

            if (sourceType === 'url') {
                urlInput.style.display = 'block';
                fileInput.style.display = 'none';
            } else {
                urlInput.style.display = 'none';
                fileInput.style.display = 'block';
            }
        }

        function showLoadProjectModal() {
            document.getElementById('loadProjectModal').classList.add('active');
            document.getElementById('existingProjectPath').focus();
        }

        function closeLoadProjectModal() {
            document.getElementById('loadProjectModal').classList.remove('active');
            document.getElementById('loadProjectError').textContent = '';
            document.getElementById('loadProjectForm').reset();
        }

        async function createNewProject(event) {
            event.preventDefault();

            const name = document.getElementById('projectName').value.trim();
            const path = document.getElementById('projectPath').value.trim();
            const errorDiv = document.getElementById('newProjectError');
            const sourceType = document.querySelector('input[name="textSourceType"]:checked').value;

            console.log('━━━ [CREATE PROJECT] START ━━━');
            console.log('[CREATE PROJECT] Name:', name);
            console.log('[CREATE PROJECT] Path:', path || '(using default)');
            console.log('[CREATE PROJECT] Source Type:', sourceType);
            console.log('[CREATE PROJECT] SERVER_URL:', SERVER_URL);
            console.log('[CREATE PROJECT] API_KEY:', API_KEY ? 'Present' : 'Missing');

            errorDiv.textContent = '';

            // Build request body - only include path if provided
            const requestBody = { name };
            if (path) {
                requestBody.path = path;
            }

            // Handle text source
            if (sourceType === 'url') {
                const url = document.getElementById('gutenbergUrl').value.trim();
                if (!url) {
                    errorDiv.textContent = 'Please enter a Gutenberg URL';
                    return;
                }
                requestBody.text_source = {
                    type: 'url',
                    url: url
                };
                console.log('[CREATE PROJECT] Text Source URL:', url);
            } else {
                const fileInput = document.getElementById('textFile');
                if (!fileInput.files || fileInput.files.length === 0) {
                    errorDiv.textContent = 'Please select a text file';
                    return;
                }
                const file = fileInput.files[0];
                console.log('[CREATE PROJECT] Reading file:', file.name, 'Size:', file.size);

                try {
                    const fileContent = await file.text();
                    requestBody.text_source = {
                        type: 'file',
                        content: fileContent,
                        filename: file.name
                    };
                    console.log('[CREATE PROJECT] File content length:', fileContent.length);
                } catch (err) {
                    console.error('[CREATE PROJECT] File read error:', err);
                    errorDiv.textContent = 'Failed to read file: ' + err.message;
                    return;
                }
            }

            console.log('[CREATE PROJECT] Request body keys:', Object.keys(requestBody));

            try {
                const url = `${SERVER_URL}/api/project/create`;
                console.log('[CREATE PROJECT] Sending POST to:', url);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify(requestBody)
                });

                console.log('[CREATE PROJECT] Response status:', response.status);
                console.log('[CREATE PROJECT] Response ok:', response.ok);
                console.log('[CREATE PROJECT] Response headers:', Object.fromEntries(response.headers.entries()));

                if (response.ok) {
                    const result = await response.json();
                    console.log('[CREATE PROJECT] ✓ Success! Result:', result);
                    console.log('[CREATE PROJECT] Project path:', result.project_path);
                    console.log('[CREATE PROJECT] Project path type:', typeof result.project_path);
                    console.log('[CREATE PROJECT] Project path length:', result.project_path.length);
                    console.log('[CREATE PROJECT] Project path chars:', result.project_path.split('').map(c => `${c}(${c.charCodeAt(0)})`).join(' '));

                    // Redirect to main app with project loaded
                    const encoded = encodeURIComponent(result.project_path);
                    console.log('[CREATE PROJECT] Encoded path:', encoded);
                    const redirectUrl = `app.html?project=${encoded}`;
                    console.log('[CREATE PROJECT] Redirecting to:', redirectUrl);
                    console.log('━━━ [CREATE PROJECT] END ━━━');
                    window.location.href = redirectUrl;
                } else {
                    const errorText = await response.text();
                    console.error('[CREATE PROJECT] ✗ Error response text:', errorText);
                    let error;
                    try {
                        error = JSON.parse(errorText);
                    } catch (e) {
                        error = { error: errorText };
                    }
                    console.error('[CREATE PROJECT] ✗ Error object:', error);
                    errorDiv.textContent = error.error || 'Failed to create project';
                    console.log('━━━ [CREATE PROJECT] END (ERROR) ━━━');
                }
            } catch (error) {
                console.error('[CREATE PROJECT] ✗ Exception:', error);
                console.error('[CREATE PROJECT] ✗ Stack:', error.stack);
                errorDiv.textContent = 'Network error: ' + error.message;
                console.log('━━━ [CREATE PROJECT] END (EXCEPTION) ━━━');
            }
        }

        async function loadExistingProject(event) {
            event.preventDefault();

            const path = document.getElementById('existingProjectPath').value.trim();
            const errorDiv = document.getElementById('loadProjectError');

            console.log('━━━ [LOAD PROJECT] START ━━━');
            console.log('[LOAD PROJECT] Path:', path);
            console.log('[LOAD PROJECT] SERVER_URL:', SERVER_URL);
            console.log('[LOAD PROJECT] API_KEY:', API_KEY ? 'Present' : 'Missing');

            errorDiv.textContent = '';

            try {
                const url = `${SERVER_URL}/api/project/load`;
                const requestBody = { project_path: path };
                console.log('[LOAD PROJECT] Sending POST to:', url);
                console.log('[LOAD PROJECT] Request body:', JSON.stringify(requestBody, null, 2));

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify(requestBody)
                });

                console.log('[LOAD PROJECT] Response status:', response.status);
                console.log('[LOAD PROJECT] Response ok:', response.ok);

                if (response.ok) {
                    const result = await response.json();
                    console.log('[LOAD PROJECT] ✓ Success! Result:', result);

                    // Redirect to main app with project loaded
                    const redirectUrl = `app.html?project=${encodeURIComponent(path)}`;
                    console.log('[LOAD PROJECT] Redirecting to:', redirectUrl);
                    console.log('━━━ [LOAD PROJECT] END ━━━');
                    window.location.href = redirectUrl;
                } else {
                    const errorText = await response.text();
                    console.error('[LOAD PROJECT] ✗ Error response text:', errorText);
                    let error;
                    try {
                        error = JSON.parse(errorText);
                    } catch (e) {
                        error = { error: errorText };
                    }
                    console.error('[LOAD PROJECT] ✗ Error object:', error);
                    errorDiv.textContent = error.error || 'Failed to load project';
                    console.log('━━━ [LOAD PROJECT] END (ERROR) ━━━');
                }
            } catch (error) {
                console.error('[LOAD PROJECT] ✗ Exception:', error);
                console.error('[LOAD PROJECT] ✗ Stack:', error.stack);
                errorDiv.textContent = 'Network error: ' + error.message;
                console.log('━━━ [LOAD PROJECT] END (EXCEPTION) ━━━');
            }
        }

        function loadProjectByPath(path) {
            window.location.href = `app.html?project=${encodeURIComponent(path)}`;
        }

        // Close modals on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeNewProjectModal();
                closeLoadProjectModal();
            }
        });
    </script>
</body>
</html>
